syntax = "proto3";

package pear.net;

service Master {
  rpc RegisterDevice(RegisterRequest) returns (RegisterResponse);
  rpc UpdateDB(UpdateDBRequest) returns (UpdateDBResponse);
  rpc PushWAL(PushWALRequest) returns (PushWALResponse);
}

service Replica {
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc GetReplicaState(ReplicaStateRequest) returns (ReplicaStateResponse);
}

service Storage {
  rpc GetObjectInfo(ObjectInfoRequest) returns (ObjectInfoResponse);
  rpc DownloadFile(DownloadRequest) returns (stream FileChunk);
  rpc DownloadFileRange(DownloadRangeRequest) returns (stream FileChunk);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
}

message RegisterRequest {
  string address = 1;
}

message RegisterResponse {
  bool success = 1;
  uint64 assigned_device_id = 2;
  repeated WalEntry full_wal = 3;
  string error_message = 4;
}

message UpdateDBRequest {
  uint64 last_seq_id = 1;
  uint64 device_id = 2;
}

message UpdateDBResponse {
  bool success = 1;
  repeated WalEntry entries = 2;
  string error_message = 3;
}

message PushWALRequest {
  uint64 device_id = 1;
  repeated WalEntry entries = 2;
}

message PushWALResponse {
  bool success = 1;
  repeated uint64 assigned_seq_ids = 2;
  string error_message = 3;
}

message PrepareRequest {
  uint64 view_number = 1;
  uint64 leader_device_id = 2;
  repeated WalEntry entries = 3;
  uint64 commit_number = 4;
}

message PrepareResponse {
  bool success = 1;
  uint64 view_number = 2;
  uint64 last_seq_id = 3;
  string error_message = 4;
}

message CommitRequest {
  uint64 view_number = 1;
  uint64 leader_device_id = 2;
  uint64 commit_number = 3;
}

message CommitResponse {
  bool success = 1;
  string error_message = 2;
}

message ReplicaStateRequest {
  uint64 requester_device_id = 1;
}

message ReplicaStateResponse {
  bool success = 1;
  uint64 device_id = 2;
  string address = 3;
  uint64 view_number = 4;
  uint64 commit_number = 5;
  uint64 last_normal_view = 6;
  uint64 replica_status = 7;
  uint64 last_seq_id = 8;
  string error_message = 9;
}

message DownloadRequest {
  string object_hash = 1;
  uint64 requester_device_id = 2;
}

message ObjectInfoRequest {
  string object_hash = 1;
  uint64 requester_device_id = 2;
}

message ObjectInfoResponse {
  bool success = 1;
  uint64 size = 2;
  string error_message = 3;
}

message DownloadRangeRequest {
  string object_hash = 1;
  uint64 requester_device_id = 2;
  uint64 offset = 3;
  uint64 size = 4;
}

message DeleteObjectRequest {
  string object_hash = 1;
  uint64 requester_device_id = 2;
}

message DeleteObjectResponse {
  bool success = 1;
  bool busy = 2;
  string error_message = 3;
}

message FileChunk {
  bytes data = 1;
  uint64 offset = 2;
  bool last_chunk = 3;
}

enum WalOpType {
  FILE_UPDATE = 0;
  DEVICE_UPDATE = 1;
  FILE_DELETE = 2;
  OBJECT_OWNER_UPDATE = 3;
  OBJECT_OWNER_DELETE = 4;
}

message FileUpdate {
  string path = 1;
  string object_hash = 2;
  uint64 version = 3;
  uint64 owner_device_id = 4;
  bool read_only = 5;
}

message FileDelete {
  string path = 1;
  uint64 version = 2;
  uint64 owner_device_id = 3;
}

message DeviceUpdate {
  uint64 device_id = 1;
  string address = 2;
}

message ObjectOwnerUpdate {
  string object_hash = 1;
  uint64 owner_device_id = 2;
}

message WalEntry {
  uint64 seq_id = 1;
  uint64 timestamp = 2;
  WalOpType op_type = 3;
  uint64 entry_view_number = 9;

  oneof data {
    FileUpdate file_update = 4;
    DeviceUpdate device_update = 5;
    FileDelete file_delete = 6;
    ObjectOwnerUpdate object_owner_update = 7;
    ObjectOwnerUpdate object_owner_delete = 8;
  }
}
